const ITER = 600000;
function b64dec(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64dec(SALT_B64),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(IV_B64)},key,b64dec(DATA_B64));
  return new TextDecoder().decode(pt);
}
async function tryOpen(pw){
  try{
    const html=await unlock(pw);
    sessionStorage.setItem('wedding-pw',pw);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('err').textContent='密码不对，再试一次';
  }
}
document.getElementById('go').addEventListener('click',()=>{const pw=document.getElementById('pw').value;if(pw)tryOpen(pw);});
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
const saved=sessionStorage.getItem('wedding-pw');
if(saved){document.getElementById('pw').value=saved;tryOpen(saved);}
</script>
